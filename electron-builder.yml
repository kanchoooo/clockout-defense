# 칼퇴 디펜스 패키징 설정 (첫눈·웜홀·비둘기 모니터와 같은 구조)
# - 맥: 유니버설(arm64+x64) dmg + zip. 맥북에서 빌드 (scripts/build-mac.mjs — 서명·공증).
# - 윈도우: 서명 없이 NSIS. 파일명 고정 — 버전을 붙이면 SmartScreen 평판이 초기화된다.
appId: com.clockoutdefense.app
# 맥에서 번들/헬퍼 이름이 한글이면 Electron 이 시작 시 크래시 → 파일 이름은 영문, 표시 이름만 한글
productName: ClockOutDefense
copyright: Copyright © 2026 clockout-defense
npmRebuild: false
directories:
  output: dist
  buildResources: build
electronLanguages: [ko, en]
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: build/tray.png
    to: tray.png
  # 오픈소스 고지: 묶음 파일에는 라이선스 문구가 남지 않으므로 앱 안에 같이 넣는다
  - from: src/renderer/src/vendor/pixelfx/LICENSE
    to: licenses/pixelfx-LICENSE.txt
  - from: src/renderer/src/vendor/pixelfx/NOTICE.md
    to: licenses/pixelfx-NOTICE.md
  - from: src/renderer/src/assets/fonts/Galmuri-OFL.txt
    to: licenses/Galmuri-OFL.txt
mac:
  category: public.app-category.games
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: ClockOutDefense-mac.${ext}
  extendInfo:
    CFBundleDisplayName: 칼퇴 디펜스
    NSHumanReadableCopyright: Copyright © 2026 clockout-defense
dmg:
  title: 칼퇴 디펜스
  sign: true
  artifactName: ClockOutDefense-mac.dmg
  window:
    width: 540
    height: 380
win:
  executableName: ClockOutDefense
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
  artifactName: ClockOutDefense-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 칼퇴 디펜스
  artifactName: ClockOutDefense-Setup.${ext}
  deleteAppDataOnUninstall: false
